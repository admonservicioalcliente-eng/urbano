<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nassau TIC - Administración</title>
    
    <!-- PWA Meta tags -->
    <meta name="theme-color" content="#f59e0b">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/png" href="/assets/favicon.png">
    <link rel="apple-touch-icon" href="/assets/logo-192.png">

    <!-- CSS -->
    <link rel="stylesheet" href="/css/main.css">
    
    <!-- jsPDF -->
    <script src="/js/lib/jspdf.umd.min.js"></script>
    <!-- Cloudflare Turnstile -->
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>
<body>
    <!-- Loading Spinner -->
    <div id="app-loading">
        <div class="spinner"></div>
    </div>

    <!-- Toast Notification -->
    <div id="toast">Notificación</div>

    <!-- Login Screen -->
    <div id="login-screen">
        <div class="login-card">
            <img id="login-logo-img" src="/assets/logo.jpg" alt="Logo" class="login-logo" onerror="this.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI4MCIgaGVpZ2h0PSI4MCI+PGNpcmNsZSBjeD0iNDAiIGN5PSI0MCIgcj0iNDAiIGZpbGw9IiMzMzMiLz48L3N2Zz4='">
            <h2>Nassau TIC</h2>
            <form id="login-form">
                <div class="form-group">
                    <label>Edificio</label>
                    <select id="login-urb" required></select>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="login-email" required>
                </div>
                <div class="form-group">
                    <label>Contraseña</label>
                    <div style="position:relative;">
                        <input type="password" id="login-password" required>
                        <button type="button" onclick="window.NassauApp.togglePassVisibility('login-password')" style="position:absolute; right:8px; top:50%; transform:translateY(-50%); background:none; border:none; cursor:pointer; font-size:1.2rem;" title="Ver contraseña">👁️</button>
                    </div>
                </div>
                <div class="form-group">
                    <div class="cf-turnstile" data-sitekey="0x4AAAAAAEkSbr2_4ud3eS1H"></div>
                </div>
                <button type="submit" class="btn-primary" style="width: 100%;">Iniciar Sesión</button>
            </form>
            <div class="login-divider">o</div>
            <button type="button" id="btn-registro-toggle" class="btn-outline" style="width: 100%;">Registrar nuevo Edificio</button>
            <form id="registro-form" style="display:none; margin-top: 1rem;">
                <div class="form-group">
                    <label>Nombre del Edificio *</label>
                    <input type="text" id="reg-nombre" required>
                </div>
                <div class="form-group">
                    <label>Dirección</label>
                    <input type="text" id="reg-direccion">
                </div>
                <div class="form-group">
                    <label>Teléfono</label>
                    <input type="text" id="reg-telefono">
                </div>
                <div class="form-group">
                    <label>Email de contacto</label>
                    <input type="email" id="reg-email">
                </div>
                <div class="form-group">
                    <label>Logo del edificio (mín. 200x200 px, JPG/PNG, máx. 700 KB)</label>
                    <input type="file" id="reg-logo" accept="image/jpeg,image/png" class="search-input">
                </div>
                <div class="form-group">
                    <label>Prefijo de documentos</label>
                    <input type="text" id="reg-prefijo" value="NAS" maxlength="10">
                </div>
                <hr style="margin: 10px 0; border-color: #ddd;">
                <p style="font-weight: bold; margin-bottom: 10px;">Datos bancarios(para PDF)</p>
                <div class="form-group"><label>Número de Cuenta</label><input type="text" id="reg-banco-cuenta"></div>
                <div class="form-group"><label>Tipo de Cuenta</label>
                    <select id="reg-banco-tipo">
                        <option value="ahorros">Ahorros</option>
                        <option value="corriente">Corriente</option>
                    </select>
                </div>
                <div class="form-group"><label>Banco</label>
                    <select id="reg-banco-nombre">
                        <option value="">— Seleccionar banco —</option>
                        <option value="Bancolombia">Bancolombia</option>
                        <option value="Banco de Bogotá">Banco de Bogotá</option>
                        <option value="Banco Davivienda">Banco Davivienda</option>
                        <option value="Banco BBVA">Banco BBVA</option>
                        <option value="Banco de Occidente">Banco de Occidente</option>
                        <option value="Banco Popular">Banco Popular</option>
                        <option value="Banco AV Villas">Banco AV Villas</option>
                        <option value="Banco Caja Social">Banco Caja Social</option>
                        <option value="Banco Colpatria">Banco Colpatria</option>
                        <option value="Banco Itaú">Banco Itaú</option>
                        <option value="Scotiabank Colpatria">Scotiabank Colpatria</option>
                        <option value="Banco Falabella">Banco Falabella</option>
                        <option value="Banco Confiar">Banco Confiar</option>
                        <option value="Banco Coomeva">Banco Coomeva</option>
                        <option value="Banco Agrícola">Banco Agrícola</option>
                        <option value="Banco Crédito">Banco Crédito</option>
                        <option value="Banco Santander">Banco Santander</option>
                        <option value="Banco Pichincha">Banco Pichincha</option>
                        <option value="Banco W">Banco W</option>
                        <option value="Bancamía">Bancamía</option>
                        <option value="Lulo Bank">Lulo Bank</option>
                        <option value="Nequi">Nequi</option>
                        <option value="Daviplata">Daviplata</option>
                        <option value="RappiPay">RappiPay</option>
                        <option value="Nu Colombia">Nu Colombia</option>
                    </select>
                </div>
                <div class="form-group"><label>Titular de la Cuenta</label><input type="text" id="reg-banco-titular"></div>
                <div class="form-group"><label>Celular de Contacto</label><input type="text" id="reg-banco-celular"></div>
                <div class="form-group">
                    <label>Nombre del administrador *</label>
                    <input type="text" id="reg-admin-nombre" required>
                </div>
                <div class="form-group">
                    <label>Email de acceso *</label>
                    <input type="email" id="reg-admin-email" required>
                </div>
                <div class="form-group">
                    <label>Contraseña de acceso (mín. 8 caracteres) *</label>
                    <div style="position:relative;">
                        <input type="password" id="reg-admin-password" required minlength="8">
                        <button type="button" onclick="window.NassauApp.togglePassVisibility('reg-admin-password')" style="position:absolute; right:8px; top:50%; transform:translateY(-50%); background:none; border:none; cursor:pointer; font-size:1.2rem;" title="Ver contraseña">👁️</button>
                    </div>
                </div>
                <button type="submit" class="btn-primary" style="width: 100%;">Solicitar registro</button>
            </form>
        </div>
        <p class="login-footer">¿Es un edificio nuevo? Regístrese y el SUPERADMIN aprobará su acceso.</p>
    </div>

    <!-- App Shell -->
    <div id="app-shell">
        <nav class="sidebar">
            <div class="brand">
                <div class="login-logo" style="width:40px; height:40px; margin-bottom:0;">
                    <img id="sidebar-logo-img" src="/assets/logo.jpg" alt="Logo" style="width:100%; border-radius:50%;" onerror="this.style.display='none'">
                </div>
                <span id="app-brand-title">NASSAU P.H.</span>
            </div>
            <div class="nav-menu">
                <a href="#" class="nav-link" data-page="dashboard">Dashboard</a>
                <a href="#" class="nav-link" data-page="propietarios">Propietarios</a>
                <a href="#" class="nav-link" data-page="pagos">Pagos</a>
                <a href="#" class="nav-link" data-page="estados">Estado Cuenta</a>
                <a href="#" class="nav-link" data-page="cobros">Cuentas Cobro</a>
                <a href="#" class="nav-link" data-page="config">Configuración</a>
                <a href="#" class="nav-link" data-page="superadmin" style="display:none; color:var(--accent);">SuperAdmin</a>
            </div>
            <div class="user-info">
                <div style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 120px;" id="user-info-name">Usuario</div>
                <a href="#" class="nav-link" data-page="logout" style="padding:0.3rem;">Salir</a>
            </div>
        </nav>

        <main class="main-content">
            <button id="mobile-menu-btn">☰</button>
            
            <div id="page-dashboard" class="page"></div>
            <div id="page-propietarios" class="page"></div>
            <div id="page-pagos" class="page"></div>
            <div id="page-estados" class="page"></div>
            <div id="page-cobros" class="page"></div>
            <div id="page-config" class="page"></div>
            <div id="page-superadmin" class="page"></div>
        </main>
    </div>

    <!-- Modal Container -->
    <div id="modal-overlay">
        <div id="modal-container"></div>
    </div>

    <!-- Scripts -->
    <script src="/js/api.js?v=41"></script>
    <script src="/js/auth.js?v=41"></script>
    <script src="/js/modules/propietarios.js?v=41"></script>
    <script src="/js/modules/pagos.js?v=41"></script>
    <script src="/js/modules/estados.js?v=41"></script>
    <script src="/js/modules/documentos.js?v=41"></script>
    <script src="/js/modules/configuracion.js?v=41"></script>
    <script src="/js/modules/superadmin.js?v=41"></script>
    <script src="/js/app.js"></script>
    
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js');
                navigator.serviceWorker.addEventListener('controllerchange', () => {
                    window.location.reload();
                });
            });
        }
    </script>
</body>
</html>

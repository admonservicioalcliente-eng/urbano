name: Deploy Nassau P.H. Admin

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-worker:
    name: Deploy Cloudflare Worker (API)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: workers/package-lock.json

      - name: Install worker dependencies
        working-directory: workers
        run: npm ci

      - name: Create .env.production from secrets
        working-directory: workers
        run: |
          echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" > .env.production
          echo "TURNSTILE_SECRET_KEY=${{ secrets.TURNSTILE_SECRET_KEY }}" >> .env.production

      - name: Deploy Worker to Cloudflare
        working-directory: workers
        run: npx wrangler deploy --secrets-file .env.production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # Nota: el frontend se sirve desde los Assets del Worker
  # (wrangler.toml: [assets] directory = "public").
  # El job de Cloudflare Pages se eliminó: el token de la
  # cuenta no tiene permisos para la API de Pages (error 10000)
  # y la carpeta frontend/ es una copia obsoleta de la app.

name: CF Inspect (temp)

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Query Cloudflare API
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          api() { curl -s -H "Authorization: Bearer $TOKEN" "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT$1"; }

          echo "== deployments top =="
          api "/workers/scripts/nassau-api/deployments?per_page=1" > /tmp/dep.json
          cat /tmp/dep.json
          echo
          vid=$(grep -o '"version_id": *"[^"]*"' /tmp/dep.json | head -1 | sed 's/.*"\([^"]*\)"$/\1/')
          echo "== version $vid =="
          api "/workers/scripts/nassau-api/versions/$vid" > /tmp/ver.json
          cat /tmp/ver.json
          echo
          echo "== live probes =="
          for p in "/" "/js/modules/documentos.js" "/deploy-check.txt"; do
            echo "--- $p"
            curl -s -D - -o /dev/null "https://nassau-api.policomputo.workers.dev$p" \
              | grep -iE 'HTTP/|cache-control|cf-cache-status|etag|content-length'
          done

name: CF Inspect (temp)

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Query Cloudflare API
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          api() { curl -s -H "Authorization: Bearer $TOKEN" "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT$1"; }

          echo "== account =="
          api "" | head -c 400
          echo
          echo "== scripts =="
          api "/workers/scripts" | head -c 2000
          echo
          echo "== deployments top =="
          api "/workers/scripts/nassau-api/deployments?per_page=3" | head -c 2000
          echo
          echo "== deployed script markers =="
          api "/workers/scripts/nassau-api" > /tmp/script.js
          wc -c /tmp/script.js
          grep -c "ASSETS.fetch" /tmp/script.js || true
          grep -c "Missing Authorization header" /tmp/script.js || true
          grep -c "periodosConcepto" /tmp/script.js || true
          echo "== live probes =="
          for p in "/" "/js/modules/documentos.js" "/deploy-check.txt"; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://nassau-api.policomputo.workers.dev$p")
            echo "$p -> $code"
          done
